cds-engine:
  module-canonical-definition-map:
    '[http://cdsframework.org/PlanDefinition/ice-forecast|1.0.0]':
      code-systems:
        RECOMMENDATION_REASON_CONCEPT:
          name: RECOMMENDATION_REASON_CONCEPT
          identifier:
            - system: urn:ietf:rfc:3986
              value: urn:oid:2.16.840.1.113883.3.795.12.100.6
          description: Supported recommendation reasons for display
          url: http://terminology.cdsframework.org/ice/recommendation-reason
          title: 'ICE Recommendation Reasons: All'
          version: 1.0.0
          status: active
          content: complete
          concept:
            - code: COMPLETE_HIGH_RISK
              display: Series complete, unless high risk.
            - code: TOO_OLD_HIGH_RISK
              display: Vaccine not generally recommended at this age, unless high risk.
            - code: ABOVE_AGE_MAY_COMPLETE
              display: Above recommended age but may complete series.
            - code: PROOF_OF_IMMUNITY
              display: Proof of Immunity.
            - code: DISEASE_DOCUMENTED
              display: Disease Documented.
            - code: TOO_OLD
              display: Vaccine not recommended at this age.
            - code: TOO_OLD_TO_INITIATE
              display: Vaccine not recommended at this age; too old to initiate.
            - code: VAC_GROUP_NO_LONGER_REC
              display: This vaccine group is no longer recommended.
            - code: EXECUTION_TIME_BEFORE_ADMINISTERED_SHOTS
              display: A recommended cannot be made; the execution time that was specified in the request to ICE is before one or more administered
                shots.
            - code: CLINICAL_PATIENT_DISCRETION
              display: At Clinical/Patient Discretion.
            - code: OTHER_VACCINE_PRODUCT_POSSIBLE
              display: In addition to the vaccine product recommended, there are other vaccine products possible.
            - code: BELOW_MINIMUM_AGE_HIGH_RISK_SERIES
              display: Below minimum age for this high risk series.
            - code: BASED_ON_VAC_AVAIL_AND_PRIORITY_RECS
              display: Based on vaccine availability and priority recommendations.
            - code: ADMINISTER_PCV15_PCV20_OR_PCV21
              display: Administer either the PCV15, PCV20 or PCV21 vaccine.
            - code: ADMINISTER_PCV20_OR_PCV21
              display: Administer either the PCV20 or PCV21 vaccine.
            - code: ADMINISTER_PPSV23_PCV20_OR_PCV21
              display: Administer the PPSV23 vaccine; if PPSV23 is not available, may administer the PCV20 or PCV21 vaccine.
            - code: ADMINISTER_COVID19_mRNA_VACCINE
              display: Administer COVID-19 mRNA Vaccine
            - code: ADMINISTER_COVID19_BIVALENT_VACCINE
              display: Administer COVID-19 Bivalent Vaccine
            - code: ADMINISTER_mRNA_VACCINE
              display: Administer mRNA Vaccine
            - code: ADMINISTER_TDAP_OR_TD
              display: Administer Tdap or Td vaccine
            - code: INSUFFICIENT_INFORMATION
              display: Insufficient information is available to make a recommendation.
