cds-engine:
  module-canonical-definition-map:
    '[http://cdsframework.org/PlanDefinition/ice-forecast|1.0.0]':
      code-systems:
        SUPPLEMENTAL_RECOMMENDATION_REASON_CONCEPT:
          name: SUPPLEMENTAL_RECOMMENDATION_REASON_CONCEPT
          identifier:
            - system: urn:ietf:rfc:3986
              value: urn:oid:2.16.840.1.113883.3.795.12.100.50
          description: Supported supplemental recommendation reasons for display
          url: http://terminology.cdsframework.org/ice/supplemental-recommendation-reason
          title: ICE Supplemental Recommendation Reasons
          version: 1.0.0
          status: active
          content: complete
          concept:
            - code: PCV15_OR_PCV20
              display: Administer either PCV15 or PCV20.
            - code: SUPPLEMENTAL_TEXT_ADMINISTER_TDAP_OR_TD
              display: Administer either Tdap or Td.
            - code: CHOLERA_NOT_ROUTINE_SEE_ACIP
              display: 'Cholera vaccination is not routinely recommended in the U.S. and only indicated for select patients at increased
              risk. Refer to ACIP and the CDC Yellow Book: Health Information for International Travel for additional information.'
            - code: PCV20_OR_PCV21_SCDM_AFTER_5Y
              display: Consider administering PCV20 or PCV21 based on Shared Clinical Decision-Making (SCDM), at least 5 years after the
                most recent dose of pneumococcal vaccine.
            - code: IF_NO_PPSV23_USE_PCV20_OR_PCV21_STOP
              display: If PPSV23 is unavailable, PCV20 or PCV21 may be administered. No further doses of any type of pneumococcal vaccine
                are recommended after PCV20 or PCV21 is given.
            - code: MATERNAL_UNK_OR_WITHIN_14D_RSV_MAB
              display: If the mother of the patient was not vaccinated during her pregnancy, her vaccination status is unknown, or she was
                vaccinated within 14 days of the patient date of birth, then administer RSV mAb dose based on patient weight shortly before
                or during the RSV season.
            - code: JE_NOT_ROUTINE_ACCEL_18_65_SEE_ACIP
              display: 'Japanese Encephalitis vaccination is not routinely recommended in the U.S. and only indicated for select patients
              at increased risk. The only age group for which an accelerated schedule is approved is 18-65 years old. Refer to ACIP and
              the CDC Yellow Book: Health Information for International Travel for additional information.'
            - code: POST_3DOSE_MONO_BIVALENT_BOOSTER_8W
              display: Patients who previously completed a 3-dose monovalent primary series are recommended to receive 1 bivalent booster
                dose, at least 8 weeks after completion of the monovalent primary series.
            - code: ADULT_RISK_PCV20_21_OR_PCV15_THEN_PPSV23
              display: The Pneumococcal evaluations and recommendations in ICE primarily target the routine series. Adults ages 19-49 with
                underlying medical conditions or other risk factors who have not previously received PCV or whose previous vaccination history
                is unknown should receive 1 dose of PCV (either PCV20, PCV21 or PCV15). When PCV15 is used, it should be followed by a dose
                of PPSV23 at the appropriate interval(s). Patients who previously received a PCV13 should receive PCV20 or PCV21. Refer
                to ACIP for additional information.
            - code: RSV_75PLUS_50_74_AT_RISK_SINGLE_DOSE
              display: 'The RSV evaluations and recommendations in ICE primarily target the routine series. RSV is recommended as a single
              lifetime dose for all adults 75 years of age and older and adults 50 through 74 years of age and older who are at increased
              risk of severe RSV disease. Note: RSV vaccine is also recommended for pregnant persons at 32 through 36 weeks gestation,
              using seasonal administration.'
            - code: RSV_75PLUS_50_74_AT_RISK
              display: The RSV evaluations and recommendations in ICE primarily target the routine series. RSV is recommended as a single
                lifetime dose for all adults 75 years of age and older and adults 50 through 74 years of age who are at increased risk of
                severe RSV disease.
            - code: TARGET_DOSE1_NOVAVAX_3W_OTHERS_8_12W
              display: The interval to target dose 1 depends on the patient's prior history and product to be used. If the last shot was
                an updated Novavax, Novavax can be administered in 3 weeks (as long as the patient is 12 years of age). If the last shot
                was not Novavax, administer at an interval of 8 weeks (for administration of Comirnaty, Novavax, or Spikevax) or 12 weeks
                (for administration of mNEXSPIKE).
            - code: TARGET_DOSE1_NOVAVAX_3W_OTHERS_8_12W_V2
              display: The interval to target dose 1 depends on the patient's prior history and product to be used. If the last shot was
                an updated Novavax, Novavax can be administered in 3 weeks. If the last shot was not Novavax, administer at an interval
                of 8 weeks (for administration of Comirnaty, Novavax, or Spikevax) or 12 weeks (for administration of mNEXSPIKE).
            - code: TARGET_DOSE2_6MO_MIN_8_12W_BY_PRODUCT
              display: The recommended interval to target dose 2 is 6 months. The minimum interval to target dose 2 depends on the product
                to be used. For administration of Comirnaty, Novavax, or Spikevax, minimum interval = 8 weeks. For administration of mNEXSPIKE,
                minimum interval = 12 weeks.
            - code: YELLOW_FEVER_LIVE_MIN_INTERVALS_SEE_ACIP
              display: 'Yellow fever vaccination is not routinely recommended in the U.S. and is only indicated for select patients at increased
              risk. Yellow fever is a live vaccine. An absolute minimum interval of 24 days is required between yellow fever vaccines.
              An absolute minimum interval of 28 days is required between a yellow fever vaccine and a live vaccine from another vaccine
              group. The minimum and recommended interval between yellow fever and another live vaccine is 30 days. Refer to ACIP and
              the CDC Yellow Book: Health Information for International Travel for additional information.'
            - code: TYPHOID_NOT_ROUTINE_SEE_ACIP
              display: 'Typhoid vaccination is not routinely recommended in the U.S. and is only indicated for select patients at increased
              risk. Refer to ACIP and the CDC Yellow Book: Health Information for International Travel for additional information.'
            - code: POLIO_ASSUME_VACCINATED
              display: Unless there are specific reasons to believe they were not
                vaccinated, most adults who were born and raised in the United States can
                assume they were vaccinated against polio as children. Refer to ACIP for
                additional information.
            - code: POLIO_COMPLETE_HIGH_RISK
              display: Adults who completed their polio vaccination but who are at
                increased risk of exposure to poliovirus may receive one lifetime IPV booster.
                Refer to ACIP for additional information.
            - code: HEP_A_3DOSE_TWINRIX_ALT_VACCINE
              display: If the Twinrix vaccine (CVX 104) is not available, another age-appropriate Hep A vaccine may be administered.
            - code: HEP_B_3DOSE_TWINRIX_ALT_VACCINE
              display: If the Twinrix vaccine (CVX 104) is not available, another adult Hep B vaccine may be administered.
            - code: HPV_NOT_ROUTINE_27_THROUGH_45
              display: HPV is not routinely recommended for all patients aged 27 through 45 years. Use Shared Clinical Decision-Making
                to identify individuals who may benefit.
            - code: MENINGB_RISK_BASED_RECOMMENDATION
              display: Meningococcal B is a risk-based recommendation for patients age 10 years and older and a shared clinical 
                decision-making recommendation for healthy patients 16–23 years of age (preferred age 16-18 years).
            - code: MENINGB_COMPLETE_HIGH_RISK
              display: Persons who have completed a MenB vaccine primary series and who remain or become at increased risk for
                invasive meningococcal disease are recommended to receive booster vaccination. Booster doses need to be from the 
                same manufacturer used for doses in the primary series.
