ice-supporting-data:
  knowledge-modules:
    '[org.nyc.cir^ICE^1.0.0]':
      code-systems:
        EVALUATION_REASON_CONCEPT:
          name: EVALUATION_REASON_CONCEPT
          identifiers:
            - value: 1f305bc0X568822e2608f22be9d1bac9c
          description: evaluation_interpretation
          url: 2.16.840.1.113883.3.795.12.100.3
          title: ICE Evaluation Reason
          version: org.nyc.cir^ICE^1.0.0
          status: active
          content: complete
          properties:
            - code: outboundCode
              type: Coding
          concepts:
            - code: D_AND_T_INVALID/P_VALID
              display: The diphtheria and tetanus components are invalid due to minimum interval violation, pertussis component valid.
            - code: DOSE_OVERRIDE_INVALID
              display: ICE has marked this shot Invalid as instructed by the user.
            - code: DOSE_OVERRIDE_VALID
              display: ICE has marked this shot Valid as instructed by the user.
            - code: PROOF_OF_IMMUNITY
              display: Proof of Immunity.
            - code: DISEASE_DOCUMENTED
              display: Disease Documented.
            - code: VACCINE_NOT_LICENSED_FOR_MALES
              display: The vaccine administered is not licensed for males.
            - code: MISSING_ANTIGEN
              display: The vaccine administered is missing an antigen.
            - code: CLINICAL_PATIENT_DISCRETION
              display: At Clinical/Patient Discretion.
            - code: VACCINE_NOT_COUNTED_BASED_ON_MOST_RECENT_VACCINE_GIVEN
              display: The vaccine will not be counted based on the most recent vaccine given. (Most recent vaccine given determines which
                series is applied.)
            - code: OUTSIDE_SERIES
              display: This immunization was administered outside of the series.
            - code: OUTSIDE_ROUTINE_SERIES
              display: This immunization was administered outside of a routine series.
            - code: MENB_SAME_DAY_DIFFERENT_PRODUCTS_UNDETERMINED
              display: The patient record indicates that different Meningococcal B products were administered on the same day. Based on
                the available information, the product administered is undetermined and therefore unable to be evaluated.
              properties:
                - code: outboundCode
                  valueCoding:
                    code: SUPPLEMENTAL_TEXT
                    system: 2.16.840.1.113883.3.795.12.100.3
                    display: Supplemental text is available for this immunization event.
            - code: COVID19_MIN_INTERVAL_8W_1ST_BOOSTER
              display: The timing of the administration of this shot does not follow the guidelines regarding the minimum interval of 8
                weeks required for the 1st Booster Dose.
              properties:
                - code: outboundCode
                  valueCoding:
                    code: SUPPLEMENTAL_TEXT
                    system: 2.16.840.1.113883.3.795.12.100.3
                    display: Supplemental text is available for this immunization event.
            - code: COVID19_MIN_INTERVAL_5M_1ST_BOOSTER
              display: The timing of the administration of this shot does not follow the guidelines regarding the minimum interval of 5
                months required for the 1st Booster Dose.
              properties:
