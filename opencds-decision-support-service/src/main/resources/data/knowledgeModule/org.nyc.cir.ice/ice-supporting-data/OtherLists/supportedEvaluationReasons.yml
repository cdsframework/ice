                    display: Supplemental text is available for this immunization event.
            - code: COVID19_MIN_AGE
              display: The timing of the administration of this shot does not follow the guidelines regarding the minimum age.
              properties:
                - code: outboundCode
                  valueCoding:
                    code: SUPPLEMENTAL_TEXT
                    system: 2.16.840.1.113883.3.795.12.100.3
                    display: Supplemental text is available for this immunization event.
            - code: DTP_PERTUSSIS_NEEDED
              display: Pertussis is needed to complete the series.
              properties:
                - code: outboundCode
                  valueCoding:
                    code: SUPPLEMENTAL_TEXT
                    system: 2.16.840.1.113883.3.795.12.100.3
                    display: Supplemental text is available for this immunization event.
            - code: DTP_DT_AGE_CONTRAINDICATION
              display: DT should only be administered to children 6 weeks through 6 years of age with a contraindication to pertussis vaccine.
              properties:
                - code: outboundCode
                  valueCoding:
                    code: SUPPLEMENTAL_TEXT
                    system: 2.16.840.1.113883.3.795.12.100.3
                    display: Supplemental text is available for this immunization event.
            - code: MPOX_MIN_INTERVAL_28D
              display: The interval between this dose and the prior shot is less than the absolute minimum interval. The dose does not need
                to be repeated unless the patient is severely immunosuppressed, in which case the repeated dose should be administered after
                the dose given in error by at least 28 days.
              properties:
                - code: outboundCode
                  valueCoding:
                    code: SUPPLEMENTAL_TEXT
                    system: 2.16.840.1.113883.3.795.12.100.3
                    display: Supplemental text is available for this immunization event.
            - code: PNEUMOCOCCAL_UNSPECIFIED_CVX
              display: CVX 109 and CVX 152 are unspecified vaccine formulations. Please update this record with the specific vaccine administered
                so that the shot can be evaluated accurately and the next dose in the series can be recommended.
              properties:
                - code: outboundCode
                  valueCoding:
                    code: SUPPLEMENTAL_TEXT
                    system: 2.16.840.1.113883.3.795.12.100.3
                    display: Supplemental text is available for this immunization event.
            - code: POLIO_CVX_89
              display: CVX 89 represents an unspecified formulation vaccine.
                Trivalent oral polio vaccine ceased to be used globally in April 2016.
                If the patient received bivalent or monovalent oral polio vaccine (bOPV or mOPV),
                additional protection is needed.
              properties:
                - code: outboundCode
                  valueCoding:
                    code: SUPPLEMENTAL_TEXT
                    system: 2.16.840.1.113883.3.795.12.100.3
                    display: Supplemental text is available for this immunization event.
