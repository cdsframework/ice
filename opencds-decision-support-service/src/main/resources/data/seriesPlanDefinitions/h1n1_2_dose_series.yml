              - system: http://terminology.hl7.org/CodeSystem/plan-definition-type
                code: eca-rule
                display: ECA Rule
          extension:
            - url: https://terminology.cdsframework.org/ice/StructureDefinition/ice-series-metadata
              extension:
                - url: numberOfDosesInSeries
                  value-integer: 2
                - url: series
                  value-codeable-concept:
                    coding:
                      - system: urn:oid:2.16.840.1.113883.3.795.12.100.10
                        code: H1N1_2_DOSE_SERIES
                        version: ICE Vaccine Series
                        display: H1N1 2-Dose Series
                    text: H1N1 2-Dose Series
                - url: vaccineGroup
                  value-codeable-concept:
                    coding:
                      - system: urn:oid:2.16.840.1.113883.3.795.12.100.1
                        code: INFLUENZA_H1N1
                        version: ICE Vaccine Group
                        display: H1N1 Influenza
                    text: H1N1 Influenza
                - url: season
                  value-codeable-concept:
                    coding:
                      - system: urn:oid:2.16.840.1.113883.3.795.12.100.11
                        code: 2009_H1N1_SEASON
                        version: ICE Vaccine Season
                        display: 2009-2010 H1N1 Season
                    text: 2009-2010 H1N1 Season
          action:
            - id: dose-1
              title: Dose 1
              extension:
                - url: https://terminology.cdsframework.org/ice/StructureDefinition/ice-dose-number
                  value-integer: 1
                - url: https://terminology.cdsframework.org/ice/StructureDefinition/ice-dose-age-constraint
                  extension:
                    - url: absoluteMinimumAge
                      value-string: 6m-4d
                    - url: minimumAge
                      value-string: 6m
                    - url: earliestRecommendedAge
                      value-string: 6m
                - url: https://terminology.cdsframework.org/ice/StructureDefinition/ice-dose-vaccine
                  extension:
                    - url: vaccine
                      value-codeable-concept:
                        coding:
                          - system: urn:oid:2.16.840.1.113883.12.292
                            code: '128'
                            version: CVX
                            display: H1N1-09 NOS
                        text: H1N1-09 NOS
                    - url: preferred
                      value-boolean: true
                - url: https://terminology.cdsframework.org/ice/StructureDefinition/ice-dose-vaccine
                  extension:
                    - url: vaccine
                      value-codeable-concept:
                        coding:
