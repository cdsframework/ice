cds-engine:
  knowledge-base-definition-map:
    '[https://terminology.cdsframework.org/PlanDefinition/ice-forecast|1.0.0]':
      plan-definitions:
        H1N1_2_DOSE_SERIES:
          resource-type: PlanDefinition
          url: https://terminology.cdsframework.org/ice/PlanDefinition/series/h1n1_2_dose_series
          version: 1.0.0
          name: H1N1_2_DOSE_SERIES
          title: H1N1 2-Dose Series
          status: active
          meta:
            profile:
              - https://terminology.cdsframework.org/ice/StructureDefinition/ice-series-plan-definition
          type:
