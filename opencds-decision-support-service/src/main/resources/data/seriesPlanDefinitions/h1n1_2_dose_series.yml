                          - system: urn:oid:2.16.840.1.113883.12.292
                            code: '126'
                            version: CVX
                            display: H1N1-09, preservative-free
                        text: H1N1-09, preservative-free
                    - url: preferred
                      value-boolean: true
                - url: https://terminology.cdsframework.org/ice/StructureDefinition/ice-dose-vaccine
                  extension:
                    - url: vaccine
