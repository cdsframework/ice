cds-engine:
  module-canonical-definition-map:
    '[http://cdsframework.org/PlanDefinition/ice-forecast|1.0.0]':
      plan-definitions:
        YELLOW_FEVER_RISK_SERIES:
          resource-type: PlanDefinition
          url: http://cdsframework.org/PlanDefinition/series/yellow_fever_risk_series
          version: 1.0.0
          name: YELLOW_FEVER_RISK_SERIES
          title: Yellow Fever Risk Series
          status: active
          meta:
            profile:
              - http://cdsframework.org/fhir/StructureDefinition/ice-series-plan-definition
          type:
            coding:
              - system: http://terminology.hl7.org/CodeSystem/plan-definition-type
                code: eca-rule
                display: ECA Rule
          extension:
            - url: http://cdsframework.org/fhir/StructureDefinition/ice-series-metadata
              extension:
                - url: numberOfDosesInSeries
                  value-integer: 1
                - url: series
                  value-codeable-concept:
                    coding:
                      - system: urn:oid:2.16.840.1.113883.3.795.12.100.10
                        code: YELLOW_FEVER_RISK_SERIES
                        version: ICE Vaccine Series
                        display: Yellow Fever Risk Series
                    text: Yellow Fever Risk Series
                - url: vaccineGroup
                  value-codeable-concept:
                    coding:
                      - system: urn:oid:2.16.840.1.113883.3.795.12.100.1
                        code: YELLOW_FEVER
                        version: ICE Vaccine Group
                        display: Yellow Fever
                    text: Yellow Fever
          action:
            - id: dose-1
              title: Dose 1
              extension:
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-number
                  value-integer: 1
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-age-constraint
                  extension:
                    - url: absoluteMinimumAge
                      value-string: 6m
                    - url: earliestRecommendedAge
                      value-string: 9m
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-vaccine
                  extension:
                    - url: vaccine
                      value-codeable-concept:
                        coding:
                          - system: urn:oid:2.16.840.1.113883.12.292
                            code: '37'
                            version: CVX
                            display: Yellow fever live
                        text: Yellow fever live
                    - url: preferred
                      value-boolean: true
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-vaccine
                  extension:
                    - url: vaccine
                      value-codeable-concept:
                        coding:
                          - system: urn:oid:2.16.840.1.113883.12.292
                            code: '183'
                            version: CVX
                            display: Yellow fever vaccine live - alt
                        text: Yellow fever vaccine live - alt
                    - url: preferred
                      value-boolean: true
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-vaccine
                  extension:
                    - url: vaccine
                      value-codeable-concept:
                        coding:
                          - system: urn:oid:2.16.840.1.113883.12.292
                            code: '184'
                            version: CVX
                            display: Yellow fever, unspecified formulation (NOS)
                        text: Yellow fever, unspecified formulation (NOS)
                    - url: preferred
                      value-boolean: true
