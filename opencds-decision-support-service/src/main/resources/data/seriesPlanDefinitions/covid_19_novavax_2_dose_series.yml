cds-engine:
  module-canonical-definition-map:
    '[http://cdsframework.org/PlanDefinition/ice-forecast|1.0.0]':
      plan-definitions:
        COVID_19_NOVAVAX_2_DOSE_SERIES:
          resource-type: PlanDefinition
          url: http://cdsframework.org/PlanDefinition/series/covid_19_novavax_2_dose_series
          version: 1.0.0
          name: COVID_19_NOVAVAX_2_DOSE_SERIES
          title: COVID-19 2-Dose Novavax Series
          status: active
          meta:
            profile:
              - http://cdsframework.org/fhir/StructureDefinition/ice-series-plan-definition
          type:
            coding:
              - system: http://terminology.hl7.org/CodeSystem/plan-definition-type
                code: eca-rule
                display: ECA Rule
          extension:
            - url: http://cdsframework.org/fhir/StructureDefinition/ice-series-metadata
              extension:
                - url: numberOfDosesInSeries
                  value-integer: 2
                - url: recurringDosesAfterSeriesComplete
                  value-boolean: true
                - url: series
                  value-codeable-concept:
                    coding:
                      - system: urn:oid:2.16.840.1.113883.3.795.12.100.10
                        code: COVID_19_NOVAVAX_2_DOSE_SERIES
                        version: ICE Vaccine Series
                        display: COVID-19 2-Dose Novavax Series
                    text: COVID-19 2-Dose Novavax Series
                - url: vaccineGroup
                  value-codeable-concept:
                    coding:
                      - system: urn:oid:2.16.840.1.113883.3.795.12.100.1
                        code: COVID_19
                        version: ICE Vaccine Group
                        display: COVID-19
                    text: COVID-19
                - url: season
                  value-codeable-concept:
                    coding:
                      - system: urn:oid:2.16.840.1.113883.3.795.12.100.11
                        code: COVID_19_DEC_2020_SEASON
                        version: ICE Vaccine Season
                        display: Pandemic COVID-19 Season
                    text: Pandemic COVID-19 Season
          action:
            - id: dose-1
              title: Dose 1
              extension:
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-number
                  value-integer: 1
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-age-constraint
                  extension:
                    - url: absoluteMinimumAge
                      value-string: 12y-4d
                    - url: earliestRecommendedAge
                      value-string: 12y
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-vaccine
                  extension:
                    - url: vaccine
                      value-codeable-concept:
                        coding:
                          - system: urn:oid:2.16.840.1.113883.12.292
                            code: '211'
                            version: CVX
                            display: COVID-19, Subunit, rS-nanoparticle+Matrix-M1 Adjuvant,
                              PF
                        text: COVID-19, Subunit, rS-nanoparticle+Matrix-M1 Adjuvant, PF
                    - url: preferred
                      value-boolean: true
            - id: dose-2
              title: Dose 2
              extension:
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-number
                  value-integer: 2
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-age-constraint
                  extension:
                    - url: absoluteMinimumAge
                      value-string: 12y-4d
                    - url: minimumAge
                      value-string: 12y
                    - url: earliestRecommendedAge
                      value-string: 12y
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-vaccine
                  extension:
                    - url: vaccine
                      value-codeable-concept:
                        coding:
                          - system: urn:oid:2.16.840.1.113883.12.292
                            code: '211'
                            version: CVX
                            display: COVID-19, Subunit, rS-nanoparticle+Matrix-M1 Adjuvant,
                              PF
                        text: COVID-19, Subunit, rS-nanoparticle+Matrix-M1 Adjuvant, PF
                    - url: preferred
                      value-boolean: true
              related-action:
                - action-id: dose-1
                  relationship: after-end
                  extension:
                    - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-interval-constraint
                      extension:
                        - url: absoluteMinimumInterval
                          value-string: 17d
                        - url: minimumInterval
                          value-string: 21d
                        - url: earliestRecommendedInterval
                          value-string: 21d
                        - url: latestRecommendedInterval
                          value-string: 8w
