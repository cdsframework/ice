                          - system: urn:oid:2.16.840.1.113883.12.292
                            code: '306'
                            version: CVX
                            display: RSV, mAb, 0.5 mL, age 0 - < 8 mos
                        text: RSV, mAb, 0.5 mL, age 0 - < 8 mos
                    - url: preferred
                      value-boolean: true
                - url: https://terminology.cdsframework.org/ice/StructureDefinition/ice-dose-vaccine
                  extension:
