                            code: '315'
                            version: CVX
                            display: Respiratory syncytial virus (RSV) MAB, unspecified
                        text: Respiratory syncytial virus (RSV) MAB, unspecified
                    - url: preferred
                      value-boolean: true
                - url: https://terminology.cdsframework.org/ice/StructureDefinition/ice-dose-vaccine
                  extension:
                    - url: vaccine
                      value-codeable-concept:
