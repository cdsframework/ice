                            code: '307'
                            version: CVX
                            display: RSV, mAb, 1 mL, age 0 - 19 mos.
                        text: RSV, mAb, 1 mL, age 0 - 19 mos.
                    - url: preferred
                      value-boolean: true
                - url: https://terminology.cdsframework.org/ice/StructureDefinition/ice-dose-vaccine
                  extension:
