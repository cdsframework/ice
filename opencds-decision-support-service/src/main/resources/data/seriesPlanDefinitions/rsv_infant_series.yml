cds-engine:
  knowledge-base-definition-map:
    '[https://terminology.cdsframework.org/PlanDefinition/ice-forecast|1.0.0]':
      plan-definitions:
        RSV_INFANT_SERIES:
          resource-type: PlanDefinition
