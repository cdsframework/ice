                  value-boolean: false
                - url: seriesGroup
                  value-integer: 1
                - url: patientEndAge
                  value-string: 20m-1d
                - url: series
                  value-codeable-concept:
                    coding:
                      - system: urn:oid:2.16.840.1.113883.3.795.12.100.10
                        code: RSV_INFANT_SERIES
                        version: ICE Vaccine Series
                        display: RSV Infant Series
                    text: RSV Infant Series
                - url: vaccineGroup
