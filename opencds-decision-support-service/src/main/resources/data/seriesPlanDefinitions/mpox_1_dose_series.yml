cds-engine:
  module-canonical-definition-map:
    '[http://cdsframework.org/PlanDefinition/ice-forecast|1.0.0]':
      plan-definitions:
        MPOX_1_DOSE_SERIES:
          resource-type: PlanDefinition
          url: http://cdsframework.org/PlanDefinition/series/mpox_1_dose_series
          version: 1.0.0
          name: MPOX_1_DOSE_SERIES
          title: Mpox 1-Dose Series
          status: active
          meta:
            profile:
              - http://cdsframework.org/fhir/StructureDefinition/ice-series-plan-definition
          type:
            coding:
              - system: http://terminology.hl7.org/CodeSystem/plan-definition-type
                code: eca-rule
                display: ECA Rule
          extension:
            - url: http://cdsframework.org/fhir/StructureDefinition/ice-series-metadata
              extension:
                - url: numberOfDosesInSeries
                  value-integer: 1
                - url: series
                  value-codeable-concept:
                    coding:
                      - system: urn:oid:2.16.840.1.113883.3.795.12.100.10
                        code: MPOX_1_DOSE_SERIES
                        version: ICE Vaccine Series
                        display: Mpox 1-Dose Series
                    text: Mpox 1-Dose Series
                - url: vaccineGroup
                  value-codeable-concept:
                    coding:
                      - system: urn:oid:2.16.840.1.113883.3.795.12.100.1
                        code: MPOX
                        version: ICE Vaccine Group
                        display: Mpox
                    text: Mpox
          action:
            - id: dose-1
              title: Dose 1
              extension:
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-number
                  value-integer: 1
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-age-constraint
                  extension:
                    - url: absoluteMinimumAge
                      value-string: 1y-4d
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-vaccine
                  extension:
                    - url: vaccine
                      value-codeable-concept:
                        coding:
                          - system: urn:oid:2.16.840.1.113883.12.292
                            code: '75'
                            version: CVX
                            display: Vaccinia (smallpox, mpox), live
                        text: Vaccinia (smallpox, mpox), live
                    - url: preferred
                      value-boolean: true
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-vaccine
                  extension:
                    - url: vaccine
                      value-codeable-concept:
                        coding:
                          - system: urn:oid:2.16.840.1.113883.12.292
                            code: '105'
                            version: CVX
                            display: Vaccinia (smallpox) vaccine, diluted
                        text: Vaccinia (smallpox) vaccine, diluted
                    - url: preferred
                      value-boolean: false
