cds-engine:
  knowledge-base-definition-map:
    '[https://terminology.cdsframework.org/PlanDefinition/ice-forecast|1.0.0]':
      plan-definitions:
        JEVC_RISK_2_DOSE_SERIES:
          resource-type: PlanDefinition
          url: https://terminology.cdsframework.org/ice/PlanDefinition/series/jevc_risk_2_dose_series
          version: 1.0.0
          name: JEVC_RISK_2_DOSE_SERIES
          title: JE-VC Risk 2-dose Series
          status: active
          meta:
            profile:
              - https://terminology.cdsframework.org/ice/StructureDefinition/ice-series-plan-definition
          type:
            coding:
              - system: http://terminology.hl7.org/CodeSystem/plan-definition-type
                code: eca-rule
                display: ECA Rule
          extension:
            - url: https://terminology.cdsframework.org/ice/StructureDefinition/ice-series-metadata
              extension:
                - url: numberOfDosesInSeries
                  value-integer: 2
                - url: series
                  value-codeable-concept:
                    coding:
                      - system: urn:oid:2.16.840.1.113883.3.795.12.100.10
                        code: JEVC_RISK_2_DOSE_SERIES
                        version: ICE Vaccine Series
                        display: JE-VC Risk 2-dose Series
                    text: JE-VC Risk 2-dose Series
                - url: vaccineGroup
                  value-codeable-concept:
                    coding:
                      - system: urn:oid:2.16.840.1.113883.3.795.12.100.1
                        code: JAPANESE_ENCEPHALITIS
                        version: ICE Vaccine Group
                        display: Japanese Encephalitis
                    text: Japanese Encephalitis
          action:
            - id: dose-1
              title: Dose 1
              extension:
                - url: https://terminology.cdsframework.org/ice/StructureDefinition/ice-dose-number
                  value-integer: 1
                - url: https://terminology.cdsframework.org/ice/StructureDefinition/ice-dose-age-constraint
                  extension:
                    - url: absoluteMinimumAge
                      value-string: 2m-4d
                    - url: minimumAge
                      value-string: 2m
                    - url: earliestRecommendedAge
                      value-string: 2m
                - url: https://terminology.cdsframework.org/ice/StructureDefinition/ice-dose-vaccine
                  extension:
                    - url: vaccine
                      value-codeable-concept:
                        coding:
                          - system: urn:oid:2.16.840.1.113883.12.292
                            code: '134'
                            version: CVX
                            display: Japanese Encephalitis IM (Ixiaro)
                        text: Japanese Encephalitis IM (Ixiaro)
                    - url: preferred
                      value-boolean: true
            - id: dose-2
              title: Dose 2
              extension:
                - url: https://terminology.cdsframework.org/ice/StructureDefinition/ice-dose-number
                  value-integer: 2
                - url: https://terminology.cdsframework.org/ice/StructureDefinition/ice-dose-vaccine
                  extension:
                    - url: vaccine
                      value-codeable-concept:
                        coding:
                          - system: urn:oid:2.16.840.1.113883.12.292
                            code: '134'
                            version: CVX
                            display: Japanese Encephalitis IM (Ixiaro)
                        text: Japanese Encephalitis IM (Ixiaro)
                    - url: preferred
                      value-boolean: true
              related-action:
                - action-id: dose-1
                  relationship: after-end
                  extension:
                    - url: https://terminology.cdsframework.org/ice/StructureDefinition/ice-dose-interval-constraint
                      extension:
                        - url: absoluteMinimumInterval
                          value-string: 24d
                        - url: minimumInterval
                          value-string: 28d
                        - url: earliestRecommendedInterval
                          value-string: 28d
