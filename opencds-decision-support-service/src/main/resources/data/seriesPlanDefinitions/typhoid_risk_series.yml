cds-engine:
  module-canonical-definition-map:
    '[http://cdsframework.org/PlanDefinition/ice-forecast|1.0.0]':
      plan-definitions:
        TYPHOID_RISK_SERIES:
          resource-type: PlanDefinition
          url: http://cdsframework.org/PlanDefinition/series/typhoid_risk_series
          version: 1.0.0
          name: TYPHOID_RISK_SERIES
          title: Typhoid Risk Series
          status: active
          meta:
            profile:
              - http://cdsframework.org/fhir/StructureDefinition/ice-series-plan-definition
          type:
            coding:
              - system: http://terminology.hl7.org/CodeSystem/plan-definition-type
                code: eca-rule
                display: ECA Rule
          extension:
            - url: http://cdsframework.org/fhir/StructureDefinition/ice-series-metadata
              extension:
                - url: numberOfDosesInSeries
                  value-integer: 1
                - url: series
                  value-codeable-concept:
                    coding:
                      - system: urn:oid:2.16.840.1.113883.3.795.12.100.10
                        code: TYPHOID_RISK_SERIES
                        version: ICE Vaccine Series
                        display: Typhoid Risk Series
                    text: Typhoid Risk Series
                - url: vaccineGroup
                  value-codeable-concept:
                    coding:
                      - system: urn:oid:2.16.840.1.113883.3.795.12.100.1
                        code: TYPHOID
                        version: ICE Vaccine Group
                        display: Typhoid
                    text: Typhoid
          action:
            - id: dose-1
              title: Dose 1
              extension:
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-number
                  value-integer: 1
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-age-constraint
                  extension:
                    - url: absoluteMinimumAge
                      value-string: 2y-4d
                    - url: earliestRecommendedAge
                      value-string: 2y
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-vaccine
                  extension:
                    - url: vaccine
                      value-codeable-concept:
                        coding:
                          - system: urn:oid:2.16.840.1.113883.12.292
                            code: '25'
                            version: CVX
                            display: Typhoid, oral
                        text: Typhoid, oral
                    - url: preferred
                      value-boolean: true
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-vaccine
                  extension:
                    - url: vaccine
                      value-codeable-concept:
                        coding:
                          - system: urn:oid:2.16.840.1.113883.12.292
                            code: '101'
                            version: CVX
                            display: Typhoid, Vi capsular polysaccharide (ViCPS)
                        text: Typhoid, Vi capsular polysaccharide (ViCPS)
                    - url: preferred
                      value-boolean: true
