                    - url: earliestRecommendedAge
                      value-string: 4y
                    - url: latestRecommendedAge
                      value-string: 7y+4w
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-vaccine
                  extension:
                    - url: vaccine
                      value-codeable-concept:
                        coding:
                          - system: urn:oid:2.16.840.1.113883.12.292
                            code: '21'
                            display: varicella
                        text: varicella
                    - url: preferred
                      value-boolean: true
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-vaccine
                  extension:
                    - url: vaccine
                      value-codeable-concept:
                        coding:
                          - system: urn:oid:2.16.840.1.113883.12.292
                            code: '94'
                            display: MMR-Varicella
                        text: MMR-Varicella
                    - url: preferred
                      value-boolean: true
