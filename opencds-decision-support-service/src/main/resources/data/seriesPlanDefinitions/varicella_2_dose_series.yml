                  value-integer: 1
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-age-constraint
                  extension:
                    - url: absoluteMinimumAge
                      value-string: 1y-4d
                    - url: minimumAge
                      value-string: 1y
                    - url: earliestRecommendedAge
                      value-string: 1y
                    - url: latestRecommendedAge
                      value-string: 16m+4w
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-vaccine
                  extension:
                    - url: vaccine
                      value-codeable-concept:
                        coding:
                          - system: urn:oid:2.16.840.1.113883.12.292
                            code: '21'
                            display: varicella
                        text: varicella
                    - url: preferred
                      value-boolean: true
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-vaccine
                  extension:
                    - url: vaccine
                      value-codeable-concept:
                        coding:
                          - system: urn:oid:2.16.840.1.113883.12.292
                            code: '94'
                            display: MMR-Varicella
                        text: MMR-Varicella
                    - url: preferred
                      value-boolean: true
            - id: dose-2
              title: Dose 2
              related-action:
                - action-id: dose-1
                  relationship: after-end
                  extension:
                    - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-interval-constraint
