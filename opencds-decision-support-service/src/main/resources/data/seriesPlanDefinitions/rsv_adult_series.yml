                    - url: minimumAge
                      value-string: 75y
                    - url: earliestRecommendedAge
                      value-string: 75y
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-vaccine
                  extension:
                    - url: vaccine
                      value-codeable-concept:
                        coding:
                          - system: urn:oid:2.16.840.1.113883.12.292
                            code: '303'
                            version: CVX
                            display: RSV, recombinant (Adult)
                        text: RSV, recombinant (Adult)
                    - url: preferred
                      value-boolean: true
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-vaccine
                  extension:
                    - url: vaccine
                      value-codeable-concept:
                        coding:
                          - system: urn:oid:2.16.840.1.113883.12.292
                            code: '304'
                            version: CVX
                            display: Respiratory syncytial virus (RSV), unspecified
                        text: Respiratory syncytial virus (RSV), unspecified
                    - url: preferred
                      value-boolean: true
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-vaccine
                  extension:
                    - url: vaccine
                      value-codeable-concept:
                        coding:
                          - system: urn:oid:2.16.840.1.113883.12.292
                            code: '305'
                            version: CVX
                            display: RSV, bivalent, PF (Adult)
                        text: RSV, bivalent, PF (Adult)
                    - url: preferred
                      value-boolean: true
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-vaccine
                  extension:
                    - url: vaccine
                      value-codeable-concept:
                        coding:
                          - system: urn:oid:2.16.840.1.113883.12.292
                            code: '314'
                            version: CVX
                            display: Respiratory syncytial virus (RSV) vaccine, unspecified
                        text: Respiratory syncytial virus (RSV) vaccine, unspecified
                    - url: preferred
                      value-boolean: true
                - url: http://cdsframework.org/fhir/StructureDefinition/ice-dose-vaccine
                  extension:
                    - url: vaccine
                      value-codeable-concept:
                        coding:
                          - system: urn:oid:2.16.840.1.113883.12.292
                            code: '326'
                            version: CVX
                            display: RSV, mRNA, injectable, PF
                        text: RSV, mRNA, injectable, PF
