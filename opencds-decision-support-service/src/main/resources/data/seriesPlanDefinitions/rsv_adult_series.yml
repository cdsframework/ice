                  value-integer: 2
                - url: patientStartAge
                  value-string: 20m
                - url: series
                  value-codeable-concept:
                    coding:
                      - system: urn:oid:2.16.840.1.113883.3.795.12.100.10
                        code: RSV_ADULT_SERIES
                        version: ICE Vaccine Series
                        display: RSV Adult Series
                    text: RSV Adult Series
                - url: vaccineGroup
