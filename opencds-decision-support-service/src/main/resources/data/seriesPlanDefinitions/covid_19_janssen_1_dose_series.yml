cds-engine:
  knowledge-base-definition-map:
    '[https://terminology.cdsframework.org/PlanDefinition/ice-forecast|1.0.0]':
      plan-definitions:
        COVID_19_JANSSEN_1_DOSE_SERIES:
          resource-type: PlanDefinition
          url: https://terminology.cdsframework.org/ice/PlanDefinition/series/covid_19_janssen_1_dose_series
          version: 1.0.0
          name: COVID_19_JANSSEN_1_DOSE_SERIES
          title: COVID-19 1-Dose Janssen Series
          status: active
          meta:
            profile:
              - https://terminology.cdsframework.org/ice/StructureDefinition/ice-series-plan-definition
          type:
            coding:
              - system: http://terminology.hl7.org/CodeSystem/plan-definition-type
                code: eca-rule
                display: ECA Rule
          extension:
            - url: https://terminology.cdsframework.org/ice/StructureDefinition/ice-series-metadata
              extension:
                - url: numberOfDosesInSeries
                  value-integer: 1
                - url: recurringDosesAfterSeriesComplete
                  value-boolean: true
                - url: series
                  value-codeable-concept:
                    coding:
                      - system: urn:oid:2.16.840.1.113883.3.795.12.100.10
                        code: COVID_19_JANSSEN_1_DOSE_SERIES
                        version: ICE Vaccine Series
                        display: COVID-19 1-Dose Janssen Series
                    text: COVID-19 1-Dose Janssen Series
                - url: vaccineGroup
                  value-codeable-concept:
                    coding:
                      - system: urn:oid:2.16.840.1.113883.3.795.12.100.1
                        code: COVID_19
                        version: ICE Vaccine Group
                        display: COVID-19
                    text: COVID-19
                - url: season
                  value-codeable-concept:
                    coding:
                      - system: urn:oid:2.16.840.1.113883.3.795.12.100.11
                        code: COVID_19_DEC_2020_SEASON
                        version: ICE Vaccine Season
                        display: Pandemic COVID-19 Season
                    text: Pandemic COVID-19 Season
          action:
            - id: dose-1
              title: Dose 1
              extension:
                - url: https://terminology.cdsframework.org/ice/StructureDefinition/ice-dose-number
                  value-integer: 1
                - url: https://terminology.cdsframework.org/ice/StructureDefinition/ice-dose-age-constraint
                  extension:
                    - url: absoluteMinimumAge
                      value-string: 0d
                    - url: earliestRecommendedAge
                      value-string: 18y
                - url: https://terminology.cdsframework.org/ice/StructureDefinition/ice-dose-vaccine
                  extension:
                    - url: vaccine
                      value-codeable-concept:
                        coding:
                          - system: urn:oid:2.16.840.1.113883.12.292
                            code: '212'
                            version: CVX
                            display: COVID-19, vector-nr, rS-Ad26, PF, Janssen
                        text: COVID-19, vector-nr, rS-Ad26, PF, Janssen
                    - url: preferred
                      value-boolean: true
