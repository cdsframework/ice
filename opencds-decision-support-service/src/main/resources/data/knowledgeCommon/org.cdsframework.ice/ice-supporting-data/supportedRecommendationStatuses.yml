cds-engine:
  knowledge-base-definition-map:
    '[https://terminology.cdsframework.org/ice/PlanDefinition/common-ice-forecast|1.0.0]':
      code-systems:
        RECOMMENDATION_STATUS_CONCEPT:
          name: RECOMMENDATION_STATUS_CONCEPT
          identifier:
            - system: urn:ietf:rfc:3986
              value: urn:oid:2.16.840.1.113883.3.795.12.100.5
          description: Supported recommendation statuses for display
          url: https://terminology.cdsframework.org/ice/recommendation-status
          title: ICE Evaluation Status
          status: active
          content: complete
          concept:
            - code: RECOMMENDED
              display: Recommended
            - code: CONDITIONAL
              display: Conditionally Recommended
            - code: FUTURE_RECOMMENDED
              display: Future Recommendation
            - code: NOT_RECOMMENDED
              display: Not Recommended
            - code: NOT_AVAILABLE
              display: Not Recommended
