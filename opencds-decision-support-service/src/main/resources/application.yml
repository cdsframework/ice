spring:
  application:
    name: ice
  config:
    import:
      - classpath:data/knowledgeCommon/org.cdsframework.ice/ice-supporting-data/iceSupportingData.yml
      - classpath:data/knowledgeModule/org.nyc.cir.ice/ice-supporting-data/iceSupportingData.yml
      - classpath:data/supportedKnowledgeBasePlanDefinitions.yml
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_empty

springdoc:
  paths-to-match:
    - '/cds/metadata'
    - '/cds/$immds-forecast'
    - '/cds/supporting-data/**'
  api-docs:
    path: /cds/ice-forecast/api-docs
    enabled: false
  swagger-ui:
    path: /cds/ice-forecast/swagger-ui.html
    enabled: false

management:
  endpoints:
    access:
      max-permitted: none

server:
  servlet:
    context-path: /opencds-decision-support-service

cxf:
  path: /evaluate

logging:
  level:
    org.drools: ERROR

cds-engine:
  experimental-features:
    enable-fhir-r6: false

open-api:
  title: CDS Immunization Calculation Engine API
  description: 'Proposed R6 ImmDS forecast operation: POST /cds/$immds-forecast. The request body is a FHIR Parameters resource and the response is a FHIR Parameters resource.'
  version: ${ice.ice-version}
  contact:
    name: ICE Support
    email: ice@hln.com
    url: http://www.hln.com/ice
  license:
    name: LGPL-3.0-or-later
    url: https://www.gnu.org/licenses/lgpl-3.0.en.html

ice:
  knowledge-bases:
    '[https://terminology.cdsframework.org/PlanDefinition/ice-forecast|1.0.0]':
      output-earliest-and-overdue-dates: true
      enable-dose-override-feature: false
      output-supplemental-text: true
      output-number-of-doses-remaining: false
      output-series-information: false
      output-vaccine-group-rules-artifact: false
      output-schedule-authorities: false
      enable-unsupported-vaccines-group: false
      vaccine-group-exclusions:
        - ANTHRAX
        - MOSQUITO_BORNE
        - CHOLERA
        - JAPANESE_ENCEPHALITIS
        - TYPHOID
        - YELLOW_FEVER
      disable-covid19-sep2023-dose-number-reset: false
      supplemental-text-mode: LEGACY
      drools-path: classpath:drools
  config-path: classpath:config
  ice-base-knowledge-base: https://terminology.cdsframework.org/ice/PlanDefinition/common-ice-forecast|1.0.0
  enable-drools-event-logging: false
  fire-limit: 25000
  ice-version: ICE_2.58.1
