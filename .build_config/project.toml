[_]
schema-version = "0.2"

[io.buildpacks]
builder = "paketobuildpacks/builder-noble-java-tiny"

[[io.buildpacks.group]]
id = "docker.io/paketobuildpacks/adoptium"

[[io.buildpacks.group]]
id = "docker.io/paketobuildpacks/java"

[[io.buildpacks.build.env]]
name = "BP_JVM_VERSION"
value = "25.*"

[[io.buildpacks.build.env]]
name = "BP_MAVEN_BUILT_MODULE"
value = "opencds-decision-support-service"
