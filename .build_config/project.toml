[_]
schema-version = "0.2"

[io.buildpacks]
builder = "us-central1-docker.pkg.dev/hln-internal/builders/java-resolute:latest"

[[io.buildpacks.build.env]]
name = "BP_JVM_VERSION"
value = "25.*"

[[io.buildpacks.build.env]]
name = "BP_MAVEN_BUILT_MODULE"
value = "opencds-decision-support-service"

[[io.buildpacks.build.env]]
name = "BP_MAVEN_ACTIVE_PROFILES"
value = "compile-rules"
